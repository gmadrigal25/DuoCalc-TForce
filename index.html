<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Calculator" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="icon" href="icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calc" id="calc">
      <!-- Reads the safe-area insets so the layout code can use them. -->
      <div class="safe-probe" id="safeProbe" aria-hidden="true"></div>

      <!-- Top left: history clock. Hold to set / clear the force number. The minute hand is the tell. -->
      <button class="round left" id="clockBtn" type="button" aria-label="History">
        <svg viewBox="0 0 24 24" style="--w: 22; --h: 22" fill="none" stroke="currentColor"
             stroke-width="2.1" stroke-linecap="round">
          <circle cx="12" cy="12" r="10.8" />
          <line x1="12" y1="12" x2="12" y2="6" />
          <line id="minuteHand" x1="12" y1="12" x2="17" y2="12" />
        </svg>
      </button>

      <!-- Top right: calculator mode. Hold to peek at the force number, double-tap for number format. -->
      <button class="round right" id="modeBtn" type="button" aria-label="Calculator mode">
        <svg viewBox="0 0 16 22" style="--w: 16; --h: 22">
          <path fill="currentColor" fill-rule="evenodd"
                d="M3.3 0h9.4A3.3 3.3 0 0 1 16 3.3v15.4a3.3 3.3 0 0 1-3.3 3.3H3.3A3.3 3.3 0 0 1 0 18.7V3.3A3.3 3.3 0 0 1 3.3 0Z
                   M3.6 2.6a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h8.8a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1Z
                   M4.3 9.6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 1 0 0-2.5Z M8 9.6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 1 0 0-2.5Z M11.7 9.6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 1 0 0-2.5Z
                   M4.3 13.6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 1 0 0-2.5Z M8 13.6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 1 0 0-2.5Z M11.7 13.6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 1 0 0-2.5Z
                   M4.3 17.6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 1 0 0-2.5Z M8 17.6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 1 0 0-2.5Z M11.7 17.6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 1 0 0-2.5Z" />
        </svg>
      </button>

      <div class="toast" id="toast" aria-live="polite"></div>

      <div class="expr" id="expr"><span id="exprText"></span></div>
      <div class="display" id="display"><span class="display-text" id="displayText">0</span></div>

      <div class="keypad" id="keypad">
        <button class="key fn" data-key="bs" type="button" aria-label="Delete">
          <svg viewBox="0 0 40 32" style="--w: 36; --h: 29" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 16 L12.5 3.2 Q13.6 2 15.2 2 H34 Q38 2 38 6 V26 Q38 30 34 30 H15.2 Q13.6 30 12.5 28.8 Z" />
            <path d="M20 11 L29 21 M29 11 L20 21" />
          </svg>
        </button>
        <button class="key fn" data-key="clear" id="clearKey" type="button">AC</button>
        <button class="key fn" data-key="percent" type="button" aria-label="Percent">
          <svg viewBox="0 0 30 30" style="--w: 31; --h: 31" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round">
            <circle cx="8" cy="8" r="5.4" />
            <circle cx="22" cy="22" r="5.4" />
            <line x1="24.5" y1="2" x2="5.5" y2="28" />
          </svg>
        </button>
        <button class="key op" data-key="/" type="button" aria-label="Divide">
          <svg viewBox="0 0 30 28" style="--w: 28; --h: 26" fill="none" stroke="currentColor"
               stroke-width="3.3" stroke-linecap="round">
            <circle cx="15" cy="3" r="2.6" fill="currentColor" stroke="none" />
            <circle cx="15" cy="25" r="2.6" fill="currentColor" stroke="none" />
            <line x1="2" y1="14" x2="28" y2="14" />
          </svg>
        </button>

        <button class="key num" data-key="7" type="button">7</button>
        <button class="key num" data-key="8" type="button">8</button>
        <button class="key num" data-key="9" type="button">9</button>
        <button class="key op" data-key="*" type="button" aria-label="Multiply">
          <svg viewBox="0 0 24 24" style="--w: 22; --h: 22" fill="none" stroke="currentColor"
               stroke-width="3.2" stroke-linecap="round">
            <path d="M2 2 L22 22 M22 2 L2 22" />
          </svg>
        </button>

        <button class="key num" data-key="4" type="button">4</button>
        <button class="key num" data-key="5" type="button">5</button>
        <button class="key num" data-key="6" type="button">6</button>
        <button class="key op" data-key="-" type="button" aria-label="Subtract">
          <svg viewBox="0 0 30 30" style="--w: 28; --h: 28" fill="none" stroke="currentColor"
               stroke-width="3.3" stroke-linecap="round">
            <line x1="2" y1="15" x2="28" y2="15" />
          </svg>
        </button>

        <button class="key num" data-key="1" type="button">1</button>
        <button class="key num" data-key="2" type="button">2</button>
        <button class="key num" data-key="3" type="button">3</button>
        <button class="key op" data-key="+" type="button" aria-label="Add">
          <svg viewBox="0 0 30 30" style="--w: 28; --h: 28" fill="none" stroke="currentColor"
               stroke-width="3.3" stroke-linecap="round">
            <path d="M2 15 H28 M15 2 V28" />
          </svg>
        </button>

        <button class="key num" data-key="negate" type="button" aria-label="Plus minus">
          <svg viewBox="0 0 30 30" style="--w: 33; --h: 33" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round">
            <path d="M7 3 V13 M2 8 H12 M21.5 2 L8 28 M19 24 H28.5" />
          </svg>
        </button>
        <button class="key num" data-key="0" type="button">0</button>
        <button class="key num" data-key="." id="decimalKey" type="button">.</button>
        <button class="key op" data-key="=" type="button" aria-label="Equals">
          <svg viewBox="0 0 26 16" style="--w: 24; --h: 14.5" fill="none" stroke="currentColor"
               stroke-width="3.3" stroke-linecap="round">
            <path d="M2 2 H24 M2 14 H24" />
          </svg>
        </button>
      </div>
    </main>
    <script src="engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
